<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">代数连通度的计算与含义</title>
  <desc id="desc">将有向网络按任一方向连接投影为无向图，构造拉普拉斯矩阵，并取第二小特征值作为代数连通度。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10 2.5 5Z" fill="#172033"/>
    </marker>
  </defs>
  <rect width="1200" height="480" fill="#fff"/>
  <g font-family="Microsoft YaHei, sans-serif">
    <text x="54" y="54" fill="#172033" font-size="30" font-weight="600">代数连通度 λ₂(G↔)</text>
    <text x="54" y="84" fill="#647083" font-size="17">先忽略方向形成可靠无向投影，再用拉普拉斯矩阵衡量网络的连通紧密程度。</text>

    <g transform="translate(54 122)">
      <rect width="276" height="210" rx="16" fill="#f8fafc" stroke="#dfe4ec"/>
      <text x="22" y="33" fill="#47556a" font-size="15" font-weight="600">01  有向网络</text>
      <path d="M83 114 190 91" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)"/>
      <path d="M195 125 88 148" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)"/>
      <circle cx="70" cy="120" r="24" fill="#172033"/><text x="70" y="126" fill="#fff" font-size="15" text-anchor="middle">1</text>
      <circle cx="206" cy="120" r="24" fill="#fff" stroke="#172033" stroke-width="2"/><text x="206" y="126" fill="#172033" font-size="15" text-anchor="middle">2</text>
      <text x="22" y="184" fill="#647083" font-size="13">保留节点与可靠边</text>
    </g>

    <path d="M344 227h34" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g transform="translate(392 122)">
      <rect width="276" height="210" rx="16" fill="#f2f6ff" stroke="#d6e0f7"/>
      <text x="22" y="33" fill="#355b9b" font-size="15" font-weight="600">02  无向投影</text>
      <path d="M91 116h118" stroke="#172033" stroke-width="3"/>
      <circle cx="70" cy="116" r="24" fill="#172033"/><text x="70" y="122" fill="#fff" font-size="15" text-anchor="middle">1</text>
      <circle cx="230" cy="116" r="24" fill="#fff" stroke="#172033" stroke-width="2"/><text x="230" y="122" fill="#172033" font-size="15" text-anchor="middle">2</text>
      <text x="22" y="172" fill="#172033" font-size="18" font-weight="600">Wᵢⱼ = max(Aᵢⱼ, Aⱼᵢ)</text>
      <text x="22" y="194" fill="#647083" font-size="12">任一方向存在连接即视为相连</text>
    </g>

    <path d="M682 227h34" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g transform="translate(730 122)">
      <rect width="416" height="210" rx="16" fill="#f1faf6" stroke="#cfe8dc"/>
      <text x="22" y="33" fill="#24705e" font-size="15" font-weight="600">03  拉普拉斯特征值</text>
      <text x="22" y="77" fill="#172033" font-size="24" font-weight="600">L = D − W</text>
      <line x1="42" y1="120" x2="374" y2="120" stroke="#d8e5df" stroke-width="8" stroke-linecap="round"/>
      <circle cx="42" cy="120" r="10" fill="#8a96a8"/>
      <circle cx="105" cy="120" r="11" fill="#24705e"/>
      <circle cx="230" cy="120" r="9" fill="#8a96a8"/>
      <circle cx="362" cy="120" r="9" fill="#8a96a8"/>
      <text x="26" y="151" fill="#647083" font-size="13">λ₁ = 0</text>
      <text x="77" y="151" fill="#24705e" font-size="15" font-weight="600">λ₂</text>
      <text x="210" y="151" fill="#647083" font-size="13">λ₃</text>
      <text x="340" y="151" fill="#647083" font-size="13">λₙ</text>
      <text x="22" y="188" fill="#24705e" font-size="16" font-weight="600">代数连通度取第二小特征值</text>
    </g>

    <g transform="translate(54 370)">
      <rect width="1092" height="78" rx="14" fill="#fff" stroke="#dfe4ec"/>
      <circle cx="34" cy="39" r="8" fill="#24705e"/>
      <text x="54" y="34" fill="#172033" font-size="14" font-weight="600">λ₂ &gt; 0：无向投影网络连通</text>
      <text x="54" y="56" fill="#647083" font-size="12">数值越大，整体连接越紧密、结构连通裕度越高。</text>
      <line x1="506" y1="18" x2="506" y2="60" stroke="#e2e6ed"/>
      <circle cx="540" cy="39" r="8" fill="#cf4b43"/>
      <text x="560" y="34" fill="#172033" font-size="14" font-weight="600">λ₂ = 0：存在孤立区域</text>
      <text x="560" y="56" fill="#647083" font-size="12">不等同于 SSC；控制判定仍以零强制覆盖为准。</text>
    </g>
  </g>
</svg>
