<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">网络故障影响分析流程</title>
  <desc id="desc">从故障集合 R 出发，形成故障后网络，经过零强制传播得到派生集合 D(G,Z)，最后判断现存节点是否全部覆盖。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10 2.5 5Z" fill="#172033"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="#fff"/>
  <text x="56" y="58" fill="#172033" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="600">从故障注入到控制判定</text>
  <text x="56" y="88" fill="#647083" font-family="Microsoft YaHei, sans-serif" font-size="17">统一分析链：故障集合 → 故障后网络 → 传播闭包 → SSC 判定</text>
  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="56" y="130" width="238" height="186" rx="16" fill="#fff7f5" stroke="#e8c9c4"/>
    <text x="78" y="165" fill="#8f3d37" font-size="14" font-weight="600">01  故障集合</text>
    <text x="78" y="205" fill="#172033" font-size="27" font-weight="600">R = { e₁, e₂ }</text>
    <path d="M92 260h112" stroke="#cf4b43" stroke-width="3"/>
    <path d="m115 246 66 28m0-28-66 28" stroke="#cf4b43" stroke-width="4" stroke-linecap="round"/>
    <text x="218" y="267" fill="#cf4b43" font-size="24" font-weight="600">×</text>
    <text x="78" y="296" fill="#647083" font-size="14">移除、失效或不确定元素</text>
    <rect x="334" y="130" width="238" height="186" rx="16" fill="#f6f8fb" stroke="#d9dfe8"/>
    <text x="356" y="165" fill="#47556a" font-size="14" font-weight="600">02  故障后网络</text>
    <circle cx="389" cy="228" r="18" fill="#172033"/>
    <circle cx="475" cy="196" r="18" fill="#fff" stroke="#172033" stroke-width="2"/>
    <circle cx="475" cy="263" r="18" fill="#fff" stroke="#172033" stroke-width="2"/>
    <path d="M405 220 456 200M405 236l51 19" stroke="#172033" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="356" y="296" fill="#647083" font-size="14">保留现存节点与可用关系</text>
    <rect x="612" y="130" width="238" height="186" rx="16" fill="#f1faf6" stroke="#cfe8dc"/>
    <text x="634" y="165" fill="#24705e" font-size="14" font-weight="600">03  零强制传播</text>
    <circle cx="669" cy="228" r="18" fill="#172033"/>
    <circle cx="755" cy="196" r="18" fill="#172033"/>
    <circle cx="755" cy="263" r="18" fill="#172033"/>
    <path d="M685 220 736 200M685 236l51 19" stroke="#172033" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="634" y="296" fill="#647083" font-size="14">重复染色至收敛，得到 D(G,Z)</text>
    <rect x="890" y="130" width="254" height="186" rx="16" fill="#f2f6ff" stroke="#d6e0f7"/>
    <text x="912" y="165" fill="#355b9b" font-size="14" font-weight="600">04  SSC 判定</text>
    <text x="912" y="205" fill="#172033" font-size="21" font-weight="600">覆盖全部现存节点</text>
    <g transform="translate(912 228)">
      <rect width="202" height="36" rx="18" fill="#e7f5ee"/>
      <path d="m18 18 7 7 14-16" fill="none" stroke="#24705e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="24" fill="#24705e" font-size="16" font-weight="600">具有强结构能控性</text>
    </g>
    <text x="912" y="296" fill="#647083" font-size="14">未覆盖节点 → 非 SSC</text>
  </g>
  <g fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M294 223h32"/><path d="M572 223h32"/><path d="M850 223h32"/>
  </g>
  <text x="56" y="374" fill="#647083" font-family="Microsoft YaHei, sans-serif" font-size="14">注：节点移除时，进入被删节点的边仍保留；由被删节点发出的边不再能够承担可靠传播。</text>
</svg>
