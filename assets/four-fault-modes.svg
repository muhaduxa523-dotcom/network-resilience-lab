<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">四类故障模式</title>
  <desc id="desc">分别展示边移除、节点移除、边不确定和节点不确定对网络结构的影响。</desc>
  <defs>
    <marker id="normalArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10 2.5 5Z" fill="#172033"/></marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10 2.5 5Z" fill="#cf4b43"/></marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10 2.5 5Z" fill="#b97a08"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#fff"/>
  <g font-family="Microsoft YaHei, sans-serif">
    <text x="54" y="54" fill="#172033" font-size="30" font-weight="600">四类故障模式</text>
    <text x="54" y="84" fill="#647083" font-size="17">故障改变传播通道；不确定边计入白色后继，但不能承担可靠染色。</text>

    <g transform="translate(48 112)">
      <rect width="528" height="184" rx="16" fill="#fff" stroke="#dfe4ec"/>
      <text x="24" y="32" fill="#172033" font-size="18" font-weight="600">边移除</text>
      <text x="24" y="57" fill="#647083" font-size="14">传播通道被直接删除</text>
      <circle cx="88" cy="116" r="24" fill="#172033"/>
      <text x="88" y="122" fill="#fff" font-size="15" text-anchor="middle" font-weight="600">1</text>
      <circle cx="292" cy="116" r="24" fill="#fff" stroke="#172033" stroke-width="2"/>
      <text x="292" y="122" fill="#172033" font-size="15" text-anchor="middle" font-weight="600">2</text>
      <path d="M113 116h142" stroke="#cf4b43" stroke-width="3"/>
      <path d="m158 97 66 38m0-38-66 38" stroke="#cf4b43" stroke-width="4" stroke-linecap="round"/>
      <text x="356" y="105" fill="#8f3d37" font-size="14">边状态</text>
      <text x="356" y="130" fill="#cf4b43" font-size="17" font-weight="600">不可用</text>
    </g>

    <g transform="translate(624 112)">
      <rect width="528" height="184" rx="16" fill="#fff" stroke="#dfe4ec"/>
      <text x="24" y="32" fill="#172033" font-size="18" font-weight="600">节点移除</text>
      <text x="24" y="57" fill="#647083" font-size="14">入边保留，节点不再输出</text>
      <circle cx="88" cy="116" r="24" fill="#172033"/>
      <text x="88" y="122" fill="#fff" font-size="15" text-anchor="middle" font-weight="600">1</text>
      <path d="M113 116h142" stroke="#cf4b43" stroke-width="3" marker-end="url(#redArrow)"/>
      <circle cx="292" cy="116" r="24" fill="#cf4b43"/>
      <path d="m281 105 22 22m0-22-22 22" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="356" y="105" fill="#8f3d37" font-size="14">节点状态</text>
      <text x="356" y="130" fill="#cf4b43" font-size="17" font-weight="600">已移除</text>
    </g>

    <g transform="translate(48 320)">
      <rect width="528" height="184" rx="16" fill="#fff" stroke="#dfe4ec"/>
      <text x="24" y="32" fill="#172033" font-size="18" font-weight="600">边不确定</text>
      <text x="24" y="57" fill="#647083" font-size="14">关系保留，但不能可靠传播</text>
      <circle cx="88" cy="116" r="24" fill="#172033"/>
      <text x="88" y="122" fill="#fff" font-size="15" text-anchor="middle" font-weight="600">1</text>
      <circle cx="292" cy="116" r="24" fill="#fff" stroke="#172033" stroke-width="2"/>
      <text x="292" y="122" fill="#172033" font-size="15" text-anchor="middle" font-weight="600">2</text>
      <path d="M113 116h142" stroke="#b97a08" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#amberArrow)"/>
      <circle cx="184" cy="97" r="16" fill="#fff" stroke="#b97a08" stroke-width="2"/>
      <text x="184" y="103" fill="#b97a08" font-size="18" text-anchor="middle" font-weight="600">?</text>
      <text x="356" y="105" fill="#8f6a24" font-size="14">边状态</text>
      <text x="356" y="130" fill="#b97a08" font-size="17" font-weight="600">不确定</text>
    </g>

    <g transform="translate(624 320)">
      <rect width="528" height="184" rx="16" fill="#fff" stroke="#dfe4ec"/>
      <text x="24" y="32" fill="#172033" font-size="18" font-weight="600">节点不确定</text>
      <text x="24" y="57" fill="#647083" font-size="14">相关出边失去确定性</text>
      <circle cx="88" cy="116" r="24" fill="#172033"/>
      <text x="88" y="122" fill="#fff" font-size="15" text-anchor="middle" font-weight="600">1</text>
      <path d="M113 116h142" stroke="#b97a08" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#amberArrow)"/>
      <circle cx="292" cy="116" r="24" fill="#fff" stroke="#b97a08" stroke-width="2.5" stroke-dasharray="7 5"/>
      <text x="292" y="103" fill="#b97a08" font-size="20" text-anchor="middle" font-weight="600">?</text>
      <text x="292" y="124" fill="#b97a08" font-size="14" text-anchor="middle" font-weight="600">2</text>
      <text x="356" y="105" fill="#8f6a24" font-size="14">节点状态</text>
      <text x="356" y="130" fill="#b97a08" font-size="17" font-weight="600">不确定</text>
    </g>
  </g>
</svg>
